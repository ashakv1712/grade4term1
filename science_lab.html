<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science Field Journal — Grade 4 · Term 1 2026</title>
<style>
  :root{--paper:#fbf6e9;--paper2:#f4edd9;--card:#fffdf7;--ink:#1f2a44;--ink2:#54608a;--green:#3a8f5c;--leaf:#a9d18e;--amber:#e9a53a;--sky:#3b8fd9;--rose:#d9534f;--grape:#8e6bbf;--line:#d9cfb3;--gold:#f0c24b;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Segoe UI","Trebuchet MS",system-ui,sans-serif;color:var(--ink);min-height:100dvh;line-height:1.45;
    background:var(--paper);background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(59,143,217,.08) 31px 32px);}
  button{font-family:inherit;cursor:pointer;} a{color:inherit;}
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(251,246,233,.94);backdrop-filter:blur(6px);border-bottom:3px double var(--line);flex-wrap:wrap;}
  .brand{font-weight:900;font-size:18px;letter-spacing:-.3px;} .brand small{display:block;font-size:10.5px;color:var(--ink2);letter-spacing:1.5px;font-weight:700;}
  .icon{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:17px;display:grid;place-items:center;}
  .player{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;flex-wrap:wrap;}
  .rank{background:var(--ink);color:var(--paper);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.3px;}
  .stk{color:var(--ink2);} .backlink{font-size:12px;color:var(--ink2);text-decoration:none;}
  main{max-width:980px;margin:0 auto;padding:22px 16px 70px;}
  .hero{text-align:center;margin:6px 0 24px;} .hero h1{font-size:clamp(26px,5.5vw,42px);letter-spacing:-.6px;line-height:1.1;} .hero p{color:var(--ink2);margin-top:6px;max-width:60ch;margin-inline:auto;}
  .exp{margin-bottom:26px;} .etitle{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;border-bottom:2px dashed var(--line);padding-bottom:6px;}
  .etitle h2{font-size:20px;} .etitle span{color:var(--ink2);font-size:13px;}
  .pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
  .page{position:relative;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:6px 18px 6px 18px;padding:16px;color:var(--ink);box-shadow:3px 4px 0 rgba(31,42,68,.08);transition:transform .12s;}
  .page:not(:disabled):hover{transform:translateY(-3px) rotate(-.4deg);border-color:var(--sky);} .page:disabled{opacity:.5;cursor:not-allowed;}
  .page .pem{font-size:36px;} .page .pt{font-weight:900;font-size:16px;margin-top:6px;} .page .ptag{font-size:11.5px;color:var(--ink2);margin-top:2px;}
  .page .pst{margin-top:10px;font-size:18px;letter-spacing:2px;color:#ddd4bd;} .page .pst b{color:var(--gold);text-shadow:0 1px 0 #b8901d;}
  .page.final{grid-column:1/-1;background:linear-gradient(135deg,#fff8e6,#fffdf7);border-color:var(--gold);} .page.final .pem{font-size:48px;}
  .lock{position:absolute;bottom:12px;right:14px;font-size:18px;}
  .stickers{display:flex;flex-wrap:wrap;gap:12px;}
  .sticker{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:#fff;border:3px solid var(--line);transform:rotate(-6deg);box-shadow:2px 3px 0 rgba(0,0,0,.08);position:relative;}
  .sticker.gold{border-color:var(--gold);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--gold);} .sticker.empty{opacity:.22;filter:grayscale(1);}
  .sticker .ss{position:absolute;bottom:-8px;font-size:9px;background:var(--ink);color:#fff;padding:1px 5px;border-radius:6px;letter-spacing:1px;transform:rotate(6deg);}
  /* mission */
  .mhead{margin-bottom:12px;} .mtitle{font-size:clamp(22px,4vw,30px);font-weight:900;} .mtag{color:var(--ink2);font-size:13px;}
  .phases{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;} .ph{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink2);background:var(--card);} .ph.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .pips{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;} .pip{width:14px;height:6px;border-radius:99px;background:#e7dfc7;} .pip.done{background:var(--green);} .pip.cur{background:var(--amber);}
  .card{background:var(--card);border:2px solid var(--line);border-radius:6px 18px 6px 18px;padding:18px;box-shadow:3px 4px 0 rgba(31,42,68,.06);} .card>*+*{margin-top:12px;}
  .lbl{font-size:12.5px;font-weight:900;color:var(--ink2);letter-spacing:.3px;} .mut{color:var(--ink2);} .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;} .row.center{justify-content:center;}
  .btn{border:2px solid var(--ink);background:#fff;color:var(--ink);padding:10px 18px;border-radius:12px;font-weight:800;font-size:14.5px;box-shadow:2px 3px 0 var(--ink);transition:transform .06s;}
  .btn:active{transform:translate(2px,3px);box-shadow:none;} .btn:disabled{opacity:.4;cursor:default;} .btn.primary{background:var(--green);color:#fff;border-color:#2b6b45;box-shadow:2px 3px 0 #2b6b45;} .btn.ghost{background:transparent;box-shadow:none;}
  .btn.sky{background:var(--sky);color:#fff;border-color:#2b6ba3;box-shadow:2px 3px 0 #2b6ba3;}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;}
  .opt{text-align:left;border:2px solid var(--line);background:#fff;color:var(--ink);padding:12px 14px;border-radius:12px;font-size:14.5px;font-weight:700;}
  .opt:hover:not(:disabled){border-color:var(--sky);} .opt.good{border-color:var(--green);background:#eaf6ee;} .opt.bad{border-color:var(--rose);background:#fbeceb;} .opt:disabled{cursor:default;}
  .qkind{display:inline-block;font-size:11px;font-weight:900;letter-spacing:1px;color:#fff;background:var(--sky);padding:3px 9px;border-radius:999px;} .qkind.Predict{background:var(--grape);} .qkind.Data{background:var(--amber);} .qkind.Label{background:var(--green);}
  .qtext{font-size:18px;font-weight:800;margin:8px 0 12px;max-width:65ch;} .msg{min-height:22px;font-weight:700;font-size:14.5px;}
  .infocard{background:#f4f8ff;border-left:4px solid var(--sky);padding:10px 12px;border-radius:8px;font-size:14.5px;}
  .objgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
  .obj{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;color:var(--ink);} .obj-em{font-size:40px;} .obj-nm{font-weight:800;margin-top:4px;font-size:13px;}
  .wobble{animation:wob .5s;} @keyframes wob{0%,100%{transform:rotate(0);}20%{transform:rotate(-6deg) scale(1.05);}40%{transform:rotate(6deg);}60%{transform:rotate(-4deg);}80%{transform:rotate(3deg);}}
  .range{flex:1;min-width:150px;accent-color:var(--sky);} .wavecv{width:100%;height:auto;background:#fff;border:2px solid var(--line);border-radius:12px;}
  .meter{flex:1;min-width:150px;height:16px;background:#eee6d0;border-radius:99px;overflow:hidden;border:1px solid var(--line);} .meterfill{height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--amber),var(--rose));transition:width .3s;}
  .bigval{font-size:22px;font-weight:900;min-width:44px;}
  .tbl{border-collapse:collapse;width:100%;background:#fff;} .tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;font-size:14px;} .tbl th{background:var(--paper2);}
  .bottles{display:flex;gap:12px;justify-content:center;align-items:flex-end;flex-wrap:wrap;}
  .bottle{width:58px;height:120px;border:3px solid var(--ink);border-top-width:8px;border-radius:8px 8px 14px 14px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;color:var(--ink);}
  .water{background:linear-gradient(180deg,#8ec5f5,var(--sky));width:100%;} .bl{position:absolute;bottom:4px;width:100%;text-align:center;font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000;}
  .tbrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;} .tbrow .btn{padding:8px 14px;}
  /* digestion */
  .bodywrap{position:relative;max-width:360px;margin:0 auto;} .bodysvg{width:100%;height:auto;display:block;}
  .skin{fill:#fde9d3;stroke:#e6c4a4;stroke-width:2;}
  [data-organ]{cursor:pointer;transition:filter .2s;} [data-organ]:hover{filter:brightness(1.08);}
  [data-organ] *{stroke-width:2;transition:.25s;}
  [data-organ="mouth"] *{fill:#e06b7a;stroke:#a83b4a;} [data-organ="oes"] *{stroke:#e8a17a;} [data-organ="stomach"] *{fill:#f2a6a6;stroke:#c25a5a;} [data-organ="small"] *{stroke:#f5c48f;} [data-organ="large"] *{stroke:#c98a5b;} [data-organ="out"] *{fill:#b78a6a;stroke:#8a5f43;}
  [data-organ].active *{filter:drop-shadow(0 0 6px var(--amber));animation:pulse 1s infinite;} @keyframes pulse{50%{opacity:.6;}}
  [data-organ].done *{filter:drop-shadow(0 0 3px var(--green));}
  [data-organ].shake{animation:wob .4s;}
  .token{position:absolute;font-size:26px;transform:translate(-50%,-50%);transition:left .7s ease,top .7s ease;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));}
  .pin{position:absolute;transform:translate(-50%,-50%);background:#fff;border:2px solid var(--green);border-radius:8px;padding:2px 8px;font-size:11px;font-weight:900;white-space:nowrap;pointer-events:none;box-shadow:1px 2px 0 rgba(0,0,0,.15);}
  .labels{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;} .labelchip{border:2px solid var(--ink);background:#fff;padding:8px 12px;border-radius:999px;font-weight:800;font-size:13px;} .labelchip.sel{background:var(--amber);} .labelchip:disabled{opacity:.35;}
  .organ-q{background:#fff8e6;border:2px solid var(--amber);border-radius:14px;padding:14px;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
  /* plate */
  .platewrap{position:relative;max-width:360px;margin:0 auto;} .platesvg{width:100%;height:auto;display:block;}
  .wedge{stroke:#fff;stroke-width:3;transition:opacity .3s;cursor:default;}
  .foodchip{position:absolute;transform:translate(-50%,-50%);font-size:24px;cursor:pointer;animation:popin .3s;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));} @keyframes popin{0%{transform:translate(-50%,-50%) scale(0);}100%{transform:translate(-50%,-50%) scale(1);}}
  .pantry{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;}
  .food{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;color:var(--ink);} .food .fe{font-size:26px;} .food .fn{font-size:10px;font-weight:800;color:var(--ink2);}
  .food:hover{border-color:var(--sky);} .food.fv{border-bottom-color:var(--green);} .food.carb{border-bottom-color:var(--amber);} .food.prot{border-bottom-color:var(--rose);} .food.dairy{border-bottom-color:var(--sky);} .food.fat{border-bottom-color:var(--grape);}
  .balance{display:grid;grid-template-columns:1fr;gap:6px;} .grow{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;padding:6px 10px;border-radius:10px;background:#fff;border:1.5px solid var(--line);} .grow .dot{width:12px;height:12px;border-radius:50%;} .grow.ok{border-color:var(--green);background:#eaf6ee;} .grow.warn{border-color:var(--rose);background:#fbeceb;}
  .goalcard{background:#fff8e6;border:2px dashed var(--amber);border-radius:14px;padding:12px 14px;font-weight:800;}
  /* orbit */
  .orbitsvg{width:100%;max-width:420px;height:auto;display:block;margin:0 auto;background:#0f1a3a;border-radius:16px;}
  .seasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;} .season{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center;color:var(--ink);min-height:110px;} .season .se{font-size:32px;} .season .sn{font-weight:900;} .season .sl{font-size:11px;color:var(--ink2);margin-top:6px;text-align:left;}
  .season.target{border-color:var(--amber);background:#fff8e6;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;} .chip{border:2px solid var(--ink);background:#fff;padding:8px 12px;border-radius:999px;font-weight:800;font-size:13px;} .chip.sel{background:var(--amber);} .chip:disabled{opacity:.3;}
  .chart{display:flex;gap:8px;align-items:flex-end;height:150px;justify-content:center;} .bar{flex:1;max-width:60px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;} .barfill{background:linear-gradient(180deg,#fbd77a,var(--amber));border-radius:6px 6px 0 0;text-align:center;font-weight:900;font-size:13px;color:#4a3300;padding-top:3px;} .barlbl{font-size:11px;text-align:center;color:var(--ink2);margin-top:4px;}
  .habs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;} .hab{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center;color:var(--ink);} .hab .he{font-size:36px;} .hab .hn{font-weight:900;} .hab .hd{font-size:11px;color:var(--ink2);}
  .creature{text-align:center;} .creature .ce{font-size:64px;} .creature .cn{font-weight:900;font-size:18px;}
  .feature{display:grid;grid-template-columns:1fr 1fr;gap:10px;} .feat{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;text-align:center;color:var(--ink);font-weight:700;} .feat .fe{font-size:30px;display:block;} .feat.good{border-color:var(--green);background:#eaf6ee;} .feat.bad{border-color:var(--rose);background:#fbeceb;}
  .chain{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:50px;} .chain .slotc{width:64px;height:64px;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;font-size:30px;background:#fff;} .arrowc{font-size:22px;color:var(--ink2);}
  /* results + journal */
  .results{text-align:center;padding:22px 10px;} .results>*+*{margin-top:14px;} .rtitle{font-size:clamp(26px,5vw,38px);font-weight:900;}
  .strow{display:flex;justify-content:center;gap:10px;} .bigst{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:#fff;border:3px solid var(--line);opacity:.3;transform:rotate(-6deg);} .bigst.lit{opacity:1;border-color:var(--gold);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--gold);animation:stamp .5s both;}
  @keyframes stamp{0%{transform:scale(2) rotate(-20deg);opacity:0;}100%{transform:scale(1) rotate(-6deg);opacity:1;}}
  .rscore{font-size:20px;color:var(--ink2);font-weight:700;}
  .jentry{background:#fff;border-left:4px solid var(--green);padding:8px 12px;border-radius:6px;font-size:14px;} .jsec{margin-bottom:18px;} .jsec h3{margin-bottom:8px;font-size:17px;} .jsec>.jentry+.jentry{margin-top:6px;}
  .jempty{color:var(--ink2);font-style:italic;font-size:13.5px;}
  #confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50;} .cf{position:absolute;top:-10px;width:10px;height:14px;border-radius:2px;animation:fall 2.2s linear forwards;} @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2;}}
  @media (max-width:700px){.two{grid-template-columns:1fr;} .feature{grid-template-columns:1fr;}}
  @media print{.top,.noprint{display:none!important;} body{background:#fff;}}
</style>
</head>
<body>
<header class="top">
  <button class="icon" id="homeBtn" title="Expedition map">🧭</button>
  <div class="brand">Science Field Journal<small>GRADE 4 · TERM 1 · 2026</small></div>
  <div class="player"><span class="rank" id="rank">Rookie Explorer</span><span class="stk">🏷️ <span id="stkTot">0</span>/33 stickers</span></div>
  <button class="icon" id="journalBtn" title="My journal">📓</button>
  <button class="icon" id="mute" title="Sound">🔊</button>
  <a class="backlink" href="index.html">Subjects</a>
</header>
<main id="screen"></main>
<div id="confetti"></div>

<script>
/* ===== helpers ===== */
const $=s=>document.querySelector(s);
function el(tag,attrs,...kids){const n=document.createElement(tag);for(const [k,v] of Object.entries(attrs||{})){if(k==='class')n.className=v;else if(k==='html')n.innerHTML=v;else if(k==='style'&&typeof v==='object')Object.assign(n.style,v);else if(k.startsWith('on')&&typeof v==='function')n.addEventListener(k.slice(2).toLowerCase(),v);else if(v!=null)n.setAttribute(k,v);}for(const kid of kids.flat()){if(kid==null)continue;n.appendChild(typeof kid==='object'?kid:document.createTextNode(String(kid)));}return n;}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)); const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let timers=[]; const later=(fn,ms)=>{const t=setTimeout(fn,ms);timers.push(t);return t;}; function clearTimers(){timers.forEach(clearTimeout);timers=[];}
function setPips(i,n){const p=$('#pips');if(!p)return;p.innerHTML='';for(let k=0;k<n;k++)p.appendChild(el('span',{class:'pip'+(k<i?' done':k===i?' cur':'')}));}
function setPhase(name){document.querySelectorAll('.ph').forEach(p=>p.classList.toggle('on',p.textContent===name));}
function confetti(){const c=$('#confetti');const cols=['#3a8f5c','#e9a53a','#3b8fd9','#d9534f','#8e6bbf'];for(let i=0;i<60;i++){const d=el('div',{class:'cf',style:{left:Math.random()*100+'vw',background:cols[i%5],animationDelay:(Math.random()*.6)+'s'}});c.appendChild(d);setTimeout(()=>d.remove(),3000);}}
/* sound */
let muted=false,actx=null,osc=null,gainN=null;
function ensureAudio(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();}
function tone(f,dur=0.4,vol=0.15,type='sine'){if(muted||!actx)return;try{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+dur);}catch(e){}}
function startTone(f,v){ensureAudio();stopTone();if(!actx||muted)return;try{osc=actx.createOscillator();gainN=actx.createGain();osc.frequency.value=f;gainN.gain.value=v;osc.connect(gainN);gainN.connect(actx.destination);osc.start();}catch(e){}}
function setTone(f,v){if(osc){osc.frequency.value=f;gainN.gain.value=v;}} function stopTone(){if(osc){try{osc.stop();}catch(e){}osc=null;}}
const sYes=()=>{tone(660,0.12,0.08);setTimeout(()=>tone(880,0.16,0.08),90);}, sNo=()=>tone(180,0.25,0.08,'triangle'), sPop=()=>tone(520,0.08,0.06), sFan=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.16,0.08,'triangle'),i*110));
$('#mute').addEventListener('click',()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊';if(muted)stopTone();});
/* state */
function safeStorage(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return{get:k=>{try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};}catch(e){const m={};return{get:k=>(k in m?m[k]:null),set:(k,v)=>{m[k]=v;}};}}
const store=safeStorage(); const state=Object.assign({stickers:{},journal:{},name:''},store.get('scijournal')||{}); const save=()=>store.set('scijournal',state);
const stk=id=>state.stickers[id]||0; let curMission=null;
function addFact(id,text){if(!id||!text)return;const list=state.journal[id]=state.journal[id]||[];if(!list.includes(text)){list.push(text);save();}}
function rankName(){const t=MISSIONS.reduce((s,m)=>s+stk(m.id),0);return t>=22?'Chief Explorer':t>=11?'Field Scientist':'Rookie Explorer';}
function refreshHeader(){$('#rank').textContent=rankName();$('#stkTot').textContent=MISSIONS.reduce((s,m)=>s+stk(m.id),0);}
/* quiz */
function quiz(host,qs,onDone){let i=0,score=0;const box=el('div');host.appendChild(box);show();
  function show(){box.innerHTML='';if(i>=qs.length){onDone(score);return;}const q=qs[i];setPips(i,qs.length);const row=el('div',{class:'opts'}),msg=el('div',{class:'msg'});
