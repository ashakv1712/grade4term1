<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computing Quest — Grade 4 · Term 1 2026</title>
<style>
  :root{--cyan:#22e0ff;--magenta:#ff3ea5;--gold:#ffd23f;--green:#3ce88b;--red:#ff4d5e;--violet:#a78bff;--orange:#ff8c42;
    --bg:#0a0a1f;--panel:#151438;--panel2:#1e1c4a;--line:#2d2a66;--ink:#e9ecff;--mut:#9aa3d6;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);min-height:100dvh;
    background:radial-gradient(900px 500px at 20% -10%,rgba(34,224,255,.14),transparent 60%),radial-gradient(900px 500px at 90% 110%,rgba(255,62,165,.14),transparent 60%),var(--bg);background-attachment:fixed;}
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;}

  /* header */
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(10,10,31,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .icon{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:17px;display:grid;place-items:center;}
  .brand{font-weight:900;font-size:17px;letter-spacing:.3px;background:linear-gradient(90deg,var(--cyan),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand small{display:block;font-size:10px;color:var(--mut);-webkit-text-fill-color:var(--mut);letter-spacing:1.5px;font-weight:700;}
  .player{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;}
  .lvl{background:var(--gold);color:#2a1d00;padding:4px 10px;border-radius:999px;font-weight:900;font-size:12px;}
  .xpbar{width:120px;height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;}
  .xpfill{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--green));transition:width .5s;}
  .startot{color:var(--gold);}
  .backlink{font-size:12px;color:var(--mut);text-decoration:none;}

  main{max-width:960px;margin:0 auto;padding:22px 16px 60px;}

  /* home */
  .hero{text-align:center;margin:8px 0 26px;}
  .hero h1{font-size:clamp(28px,6vw,46px);letter-spacing:-.5px;line-height:1.05;}
  .hero p{color:var(--mut);margin-top:6px;}
  .world{margin-bottom:28px;}
  .wtitle{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;}
  .wtitle h2{font-size:20px;} .wtitle span{color:var(--mut);font-size:13px;}
  .nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
  .node{position:relative;text-align:left;background:linear-gradient(180deg,var(--panel),#100f2e);border:2px solid var(--line);border-radius:18px;padding:16px;color:var(--ink);transition:transform .12s,border-color .2s;}
  .node:not(:disabled):hover{transform:translateY(-3px);border-color:var(--cyan);box-shadow:0 10px 30px rgba(34,224,255,.15);}
  .node:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.6);}
  .node .nem{font-size:36px;} .node .nno{position:absolute;top:10px;right:12px;font-size:11px;color:var(--mut);font-weight:800;}
  .node .nt{font-weight:900;font-size:16px;margin-top:6px;} .node .ntag{font-size:11.5px;color:var(--mut);margin-top:2px;}
  .node .nstars{margin-top:10px;font-size:15px;letter-spacing:2px;color:#3a3a6e;} .node .nstars b{color:var(--gold);}
  .node.boss{grid-column:1/-1;border-color:var(--magenta);background:linear-gradient(135deg,#2a0f2e,#150f3a);}
  .node.boss .nem{font-size:52px;} .node.boss:not(:disabled):hover{border-color:var(--magenta);box-shadow:0 10px 30px rgba(255,62,165,.25);}
  .lock{position:absolute;bottom:14px;right:14px;font-size:20px;}
  .shelf{display:flex;flex-wrap:wrap;gap:10px;}
  .bdg{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--panel);border:2px solid var(--line);position:relative;}
  .bdg.gold{border-color:var(--gold);box-shadow:0 0 16px rgba(255,210,63,.5);}
  .bdg.empty{opacity:.25;} .bdg .bs{position:absolute;bottom:-6px;font-size:9px;background:var(--bg);padding:0 4px;border-radius:6px;color:var(--gold);letter-spacing:1px;}
  .champ{margin-top:8px;background:linear-gradient(90deg,rgba(255,210,63,.15),rgba(255,62,165,.15));border:1px solid var(--gold);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}

  /* mission */
  .mhead{margin-bottom:14px;}
  .mtitle{font-size:clamp(22px,4vw,30px);font-weight:900;}
  .mbrief{color:var(--mut);margin-top:2px;}
  .pips{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap;}
  .pip{width:14px;height:6px;border-radius:99px;background:var(--panel2);} .pip.done{background:var(--green);} .pip.cur{background:var(--gold);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;}
  .card>*+*{margin-top:12px;} .card.center{text-align:center;}
  .lbl{font-size:12.5px;font-weight:800;color:var(--mut);letter-spacing:.3px;}
  .mut{color:var(--mut);} .mono{font-family:ui-monospace,Consolas,monospace;}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;} .row.center{justify-content:center;}
  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:11px 18px;border-radius:12px;font-weight:800;font-size:15px;transition:transform .06s;}
  .btn:active{transform:scale(.97);} .btn:disabled{opacity:.45;cursor:default;}
  .btn.primary{background:linear-gradient(90deg,var(--cyan),#6df1ff);color:#06122a;border:none;box-shadow:0 6px 18px rgba(34,224,255,.3);}
  .btn.ghost{background:transparent;} .btn.huge{font-size:22px;padding:18px 40px;} .btn.arrow{font-size:22px;padding:10px 18px;}
  .ti{background:#0b0b26;border:2px solid var(--line);color:var(--ink);padding:10px 12px;border-radius:12px;font-size:18px;font-family:ui-monospace,Consolas,monospace;width:130px;text-align:center;}
  .ti.big{font-size:26px;width:150px;} .ti:focus{outline:none;border-color:var(--cyan);}
  .msg{min-height:24px;font-weight:700;font-size:15px;}
  .bigcmd{font-family:ui-monospace,Consolas,monospace;font-size:clamp(26px,6vw,40px);font-weight:800;color:var(--gold);padding:8px 0;}
  .bigcmd.sm{font-size:clamp(18px,4vw,24px);font-family:inherit;color:var(--ink);}
  .tbar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;} .tfill{height:100%;width:100%;background:linear-gradient(90deg,var(--green),var(--gold),var(--red));transition:width .05s linear;}
  .flash-ok{animation:fok .5s;} .flash-no{animation:fno .5s;}
  @keyframes fok{0%{box-shadow:0 0 0 0 rgba(60,232,139,.8);}100%{box-shadow:0 0 0 18px rgba(60,232,139,0);}}
  @keyframes fno{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .shake{animation:fno .4s;}

  .varrow{display:flex;justify-content:center;gap:14px;}
  .varbox{min-width:96px;background:#0b0b26;border:2px solid var(--cyan);border-radius:14px;padding:10px;box-shadow:0 0 14px rgba(34,224,255,.2);}
  .vb-name{font-family:ui-monospace,Consolas,monospace;color:var(--cyan);font-size:13px;font-weight:800;} .vb-val{font-family:ui-monospace,Consolas,monospace;font-size:32px;font-weight:900;}
  .pop{animation:pop .35s;} @keyframes pop{0%{transform:scale(1.4);color:var(--gold);}100%{transform:scale(1);}}
  .oprow{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;}
  .opbtn{width:70px;height:70px;border-radius:18px;border:2px solid var(--line);background:var(--panel2);color:var(--ink);font-size:32px;font-weight:900;} .opbtn.wide{width:auto;padding:0 26px;font-size:26px;}
  .opbtn:hover:not(:disabled){border-color:var(--gold);}
  .rulebox{font-size:17px;background:#0b0b26;border:2px solid var(--violet);border-radius:14px;padding:12px;} .rulebox b{color:var(--violet);}
  .rulebox.newrule{animation:pop .5s;}
  .item{font-family:ui-monospace,Consolas,monospace;font-size:56px;font-weight:900;color:var(--gold);}
  .item.drop{animation:drop .35s;} @keyframes drop{0%{transform:translateY(-30px);opacity:0;}100%{transform:none;opacity:1;}}
  .bins{display:grid;grid-template-columns:1fr 1fr;gap:12px;} .bins3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .bin{padding:18px 10px;border-radius:16px;font-weight:900;font-size:16px;border:2px solid;color:var(--ink);background:var(--panel2);}
  .bin.left{border-color:var(--cyan);} .bin.right{border-color:var(--gold);} .bin.mid{border-color:var(--violet);}
  .bin:disabled{opacity:.5;}
  .maze{display:grid;gap:4px;max-width:340px;margin:0 auto;}
  .cell{aspect-ratio:1;background:#0b0b26;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:22px;}
  .cell.wall{background:#3a2a5c;border-color:#5a4a8c;}
  .prog{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:36px;}
  .step{width:34px;height:34px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;font-weight:900;}
  .step.on{background:var(--gold);color:#000;} .step.bad{background:var(--red);}
  .symrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .symbtn{background:#0b0b26;border:2px solid var(--line);border-radius:14px;padding:14px 6px;color:var(--ink);display:grid;place-items:center;min-height:96px;}
  .symbtn:hover:not(:disabled){border-color:var(--gold);} .symbtn.good{border-color:var(--green);background:rgba(60,232,139,.12);} .symbtn.bad{border-color:var(--red);}
  .sym{width:64px;height:40px;border:3px solid var(--gold);}
  .sym-oval{border-radius:999px;} .sym-rect{border-radius:2px;} .sym-dia{width:42px;height:42px;transform:rotate(45deg);border-radius:4px;} .sym-para{transform:skewX(-18deg);border-radius:2px;}
  .devbig{padding:8px;} .dev-em{font-size:64px;} .dev-nm{font-size:20px;font-weight:900;}
  .memrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left;}
  .membox{border-radius:14px;padding:12px;border:2px solid;min-height:90px;}
  .membox.ram{border-color:var(--orange);background:rgba(255,140,66,.08);} .membox.store{border-color:var(--green);background:rgba(60,232,139,.08);}
  .mlbl{font-size:11.5px;font-weight:800;color:var(--mut);} .mval{font-family:ui-monospace,Consolas,monospace;font-size:15px;margin-top:6px;} .mval.big{font-size:34px;font-weight:900;color:var(--gold);margin:0;}
  .bits{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;}
  .bit{border:2px solid var(--line);background:#0b0b26;color:var(--ink);border-radius:10px;padding:8px 2px;} .bit.on{background:rgba(255,210,63,.2);border-color:var(--gold);}
  .bv{font-family:ui-monospace,Consolas,monospace;font-size:20px;font-weight:900;} .bw{font-size:10px;color:var(--mut);}
  .chart{display:flex;gap:10px;align-items:flex-end;height:170px;justify-content:center;padding:0 10px;}
  .bar{flex:1;max-width:70px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;}
  .barfill{background:linear-gradient(180deg,var(--cyan),#1b7fa8);border-radius:8px 8px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:4px;font-weight:900;font-size:14px;color:#06122a;transition:height .3s;}
  .bar.click{cursor:pointer;} .bar.click:hover .barfill{background:linear-gradient(180deg,var(--gold),#b8901d);}
  .barlbl{font-size:12px;color:var(--mut);margin-top:6px;text-align:center;}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
  .opt{text-align:left;border:2px solid var(--line);background:#0b0b26;color:var(--ink);padding:13px 14px;border-radius:13px;font-size:15px;font-weight:700;}
  .opt.good{border-color:var(--green);background:rgba(60,232,139,.15);} .opt.bad{border-color:var(--red);background:rgba(255,77,94,.15);} .opt:disabled{cursor:default;}
  .pet{font-size:64px;} .iqbar{height:12px;background:var(--panel2);border-radius:99px;overflow:hidden;max-width:320px;margin:0 auto;} .iqfill{height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--cyan));transition:width .4s;}
  .slots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .slot{border:2px dashed var(--line);border-radius:14px;padding:10px;background:#0b0b26;color:var(--ink);min-height:70px;}
  .slot .sk{font-size:11px;font-weight:900;} .slot .sv{font-size:13.5px;margin-top:4px;color:var(--mut);}
  .slot.in .sk{color:var(--cyan);} .slot.pr .sk{color:var(--gold);} .slot.out .sk{color:var(--green);}
  .slot.filled{border-style:solid;} .slot.filled .sv{color:var(--ink);font-weight:700;}
  .slot.lit{box-shadow:0 0 16px rgba(60,232,139,.5);border-color:var(--green);} .slot.wrong{border-color:var(--red);}
  .tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .tile{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:9px 13px;border-radius:10px;font-weight:700;font-size:13.5px;} .tile:disabled{opacity:.3;}
  .ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;font-size:14px;} .range{flex:1;min-width:140px;accent-color:var(--cyan);}
  .check{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#0b0b26;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14px;font-weight:700;} .check input{width:18px;height:18px;accent-color:var(--gold);}
  .scene{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .sceneitem{background:#0b0b26;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center;transition:.25s;}
  .sceneitem.on{border-color:var(--green);background:rgba(60,232,139,.12);box-shadow:0 0 16px rgba(60,232,139,.35);}
  .se-emoji{font-size:32px;} .se-lbl{font-size:12px;font-weight:800;margin-top:4px;}
  .goals{display:flex;flex-direction:column;gap:6px;} .goal{background:#0b0b26;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:700;} .goal.done{border-color:var(--green);color:var(--green);}
  .boss{font-size:72px;transition:transform .15s;} .boss.hit{transform:scale(.8) rotate(-8deg);filter:brightness(2);}
  .hpbar{width:220px;height:14px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line);} .hpfill{height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--magenta));transition:width .3s;}
  .hearts{font-size:22px;letter-spacing:4px;} .qtop{font-size:12px;font-weight:900;color:var(--magenta);letter-spacing:1px;}
  .fb{border-radius:12px;padding:11px 14px;font-size:14.5px;border:1px solid;text-align:left;}
  .fb.ok{background:rgba(60,232,139,.12);border-color:rgba(60,232,139,.5);} .fb.no{background:rgba(255,77,94,.12);border-color:rgba(255,77,94,.5);}

  /* results */
  .results{text-align:center;padding:26px 10px;} .results>*+*{margin-top:14px;}
  .rtitle{font-size:clamp(26px,5vw,38px);font-weight:900;}
  .starrow{font-size:60px;letter-spacing:6px;} .bigstar{color:#2c2a5a;display:inline-block;} .bigstar.lit{color:var(--gold);animation:starpop .5s both;text-shadow:0 0 22px rgba(255,210,63,.7);}
  @keyframes starpop{0%{transform:scale(0) rotate(-40deg);}70%{transform:scale(1.3);}100%{transform:scale(1);}}
  .rscore{font-family:ui-monospace,Consolas,monospace;font-size:22px;color:var(--mut);}
  .xpgain{font-size:26px;font-weight:900;color:var(--green);}
  .badge-earned{display:inline-flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--gold);border-radius:999px;padding:8px 18px;font-weight:800;} .bemoji{font-size:22px;}
  .cert{background:#fffdf5;color:#1a1a2e;border-radius:16px;padding:34px;text-align:center;border:8px double var(--gold);max-width:640px;margin:0 auto;}
  .cert h2{font-size:30px;margin:8px 0;} .cert .cname{font-size:26px;font-weight:900;border-bottom:2px solid #1a1a2e;display:inline-block;padding:0 20px;margin:10px 0;}
  #confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50;}
  .cf{position:absolute;top:-10px;width:10px;height:14px;border-radius:2px;animation:fall 2.2s linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2;}}
  @media (max-width:640px){ .memrow,.bins3{grid-template-columns:1fr;} .scene{grid-template-columns:1fr;} .xpbar{width:70px;} .slots{grid-template-columns:1fr;} }
  @media print{ .top,.noprint{display:none!important;} body{background:#fff;} }
</style>
</head>
<body>
<header class="top">
  <button class="icon" id="homeBtn" title="Mission map">🗺️</button>
  <div class="brand">Computing Quest<small>GRADE 4 · TERM 1 · 2026</small></div>
  <div class="player">
    <span class="lvl" id="lvl">LVL 1</span>
    <div class="xpbar"><div class="xpfill" id="xpfill"></div></div>
    <span id="xptxt">0 XP</span>
    <span class="startot">★ <span id="starTot">0</span>/30</span>
  </div>
  <button class="icon" id="mute" title="Sound">🔊</button>
  <button class="icon" id="unlock" title="Teacher: unlock all missions">🔓</button>
  <a class="backlink" href="index.html">Subjects</a>
</header>
<main id="screen"></main>
<div id="confetti"></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function el(tag,attrs,...kids){ const n=document.createElement(tag); for(const [k,v] of Object.entries(attrs||{})){ if(k==='class')n.className=v; else if(k==='html')n.innerHTML=v; else if(k==='style'&&typeof v==='object')Object.assign(n.style,v); else if(k.startsWith('on')&&typeof v==='function')n.addEventListener(k.slice(2).toLowerCase(),v); else if(v!=null)n.setAttribute(k,v);} for(const kid of kids.flat()){ if(kid==null)continue; n.appendChild(typeof kid==='object'?kid:document.createTextNode(String(kid))); } return n; }
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let timers=[]; const later=(fn,ms)=>{const t=setTimeout(fn,ms);timers.push(t);return t;}; const every=(fn,ms)=>{const t=setInterval(fn,ms);timers.push(t);return t;};
function clearTimers(){ timers.forEach(t=>{clearTimeout(t);clearInterval(t);}); timers=[]; }
function fb(ok,html){ const d=el('div',{class:'fb '+(ok?'ok':'no')}); d.innerHTML=html; return d; }
function flash(n,ok){ n.classList.remove('flash-ok','flash-no'); void n.offsetWidth; n.classList.add(ok?'flash-ok':'flash-no'); }
function varBox(name,value){ const v=el('div',{class:'vb-val'},String(value)); const node=el('div',{class:'varbox'},el('div',{class:'vb-name'},name),v); return {node,set(x){v.textContent=String(x);v.classList.remove('pop');void v.offsetWidth;v.classList.add('pop');}}; }
function timerBar(sec,onEnd){ const fill=el('div',{class:'tfill'}); const bar=el('div',{class:'tbar'},fill); const start=Date.now(); let ended=false; const t=every(()=>{ const r=1-(Date.now()-start)/(sec*1000); fill.style.width=Math.max(0,r*100)+'%'; if(r<=0&&!ended){ended=true;clearInterval(t);onEnd();} },50); return {bar,stop(){ended=true;clearInterval(t);}}; }
function setPips(i,n){ const p=$('#pips'); if(!p)return; p.innerHTML=''; for(let k=0;k<n;k++)p.appendChild(el('span',{class:'pip'+(k<i?' done':k===i?' cur':'')})); }
function confetti(){ const c=$('#confetti'); const cols=['#22e0ff','#ff3ea5','#ffd23f','#3ce88b','#a78bff']; for(let i=0;i<60;i++){ const d=el('div',{class:'cf',style:{left:Math.random()*100+'vw',background:cols[i%cols.length],animationDelay:(Math.random()*0.6)+'s'}}); c.appendChild(d); setTimeout(()=>d.remove(),3000); } }
/* sound */
let muted=false,actx=null; function ensureAudio(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(actx&&actx.state==='suspended')actx.resume(); }
function beep(f,dur=0.08,type='square',vol=0.05){ if(muted||!actx)return; try{ const o=actx.createOscillator(),g=actx.createGain(); o.type=type;o.frequency.value=f;g.gain.value=vol;o.connect(g);g.connect(actx.destination);o.start(); g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);o.stop(actx.currentTime+dur);}catch(e){} }
