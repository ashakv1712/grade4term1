<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computing Lab — Grade 4 · Term 1 2026</title>
<style>
  :root{
    --bg:#0f1424; --panel:#1b2340; --panel2:#222c4e; --line:#2c3760;
    --ink:#e9edfb; --mut:#95a0c8;
    --teal:#3fd0c9; --amber:#ffb347; --green:#5fd08a; --coral:#ff6b8a; --violet:#a78bff; --blue:#5b8cff;
    --sans:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;}
  button{font-family:inherit;}
  a{color:inherit;}

  /* ---------- header ---------- */
  .bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;
    background:rgba(15,20,36,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .bar .back{font-size:13px;color:var(--mut);text-decoration:none;white-space:nowrap;}
  .bar .back:hover{color:var(--ink);}
  .titles{display:flex;flex-direction:column;line-height:1.15;}
  .titles .ttl{font-weight:800;font-size:17px;letter-spacing:-.2px;}
  .titles .sub{font-family:var(--mono);font-size:11px;color:var(--teal);}
  .prog{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12px;color:var(--mut);white-space:nowrap;}
  .track{width:150px;height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;}
  .fill{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));transition:width .4s;}
  .icon{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);cursor:pointer;font-size:16px;display:grid;place-items:center;}
  #menu{display:none;}

  /* ---------- layout ---------- */
  .app{display:grid;grid-template-columns:290px 1fr;min-height:calc(100dvh - 58px);}
  .side{border-right:1px solid var(--line);padding:14px 10px;background:#121830;
    position:sticky;top:58px;height:calc(100dvh - 58px);overflow:auto;}
  .navitem{width:100%;display:grid;grid-template-columns:34px 1fr 12px;align-items:center;gap:10px;
    text-align:left;padding:10px 10px;border-radius:12px;border:1px solid transparent;background:transparent;
    color:var(--ink);cursor:pointer;margin-bottom:4px;}
  .navitem:hover{background:var(--panel);}
  .navitem.on{background:var(--panel);border-color:var(--line);}
  .navitem .no{font-family:var(--mono);font-size:12px;color:var(--mut);}
  .navitem.on .no{color:var(--teal);}
  .ninfo{display:flex;flex-direction:column;line-height:1.2;}
  .navitem .t{font-weight:700;font-size:14px;}
  .navitem .tag{font-size:11px;color:var(--mut);margin-top:2px;}
  .navdot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line);}
  .navdot.done{background:var(--green);border-color:var(--green);box-shadow:0 0 8px rgba(95,208,138,.6);}

  .main{padding:26px clamp(16px,4vw,44px) 60px;max-width:980px;}

  /* ---------- lab ---------- */
  .lab-head{margin-bottom:18px;}
  .lab-no{font-family:var(--mono);font-size:12px;color:var(--teal);letter-spacing:1px;}
  .lab-head h2{font-size:clamp(24px,3.5vw,32px);letter-spacing:-.5px;margin:2px 0 4px;}
  .lab-obj{color:var(--mut);max-width:70ch;}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px;}
  .seg-btn{border:none;background:transparent;color:var(--mut);padding:8px 18px;border-radius:9px;cursor:pointer;font-weight:700;font-size:14px;}
  .seg-btn.on{background:var(--panel2);color:var(--ink);}
  .pane>*+*{margin-top:14px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;}
  .panel>*+*{margin-top:10px;}
  .lbl{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.3px;}
  .prose{max-width:72ch;}
  .prose p{margin-bottom:10px;}
  .prose ul{margin:6px 0 10px 20px;}
  .prose li{margin-bottom:4px;}
  .prose code{font-family:var(--mono);background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:.92em;}
  .prose .k{display:inline-block;padding:2px 8px;border-radius:6px;font-family:var(--mono);font-size:.9em;}
  .k.in{background:rgba(63,208,201,.15);color:var(--teal);} .k.pr{background:rgba(255,179,71,.15);color:var(--amber);} .k.out{background:rgba(95,208,138,.15);color:var(--green);}
  .mut{color:var(--mut);} .sm{font-size:13px;}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}

  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:9px 16px;border-radius:10px;
    cursor:pointer;font-weight:700;font-size:14px;}
  .btn:hover{border-color:var(--mut);}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;}
  .btn:disabled{opacity:.5;cursor:default;}
  .ti{background:#0f1528;border:1px solid var(--line);color:var(--ink);padding:9px 12px;border-radius:10px;font-size:15px;
    font-family:var(--mono);width:150px;}
  .ti.wide{width:100%;font-family:var(--sans);}
  .ti:focus,.sel:focus{outline:2px solid var(--blue);outline-offset:1px;}
  .sel{background:#0f1528;border:1px solid var(--line);color:var(--ink);padding:8px 10px;border-radius:9px;font-size:13.5px;width:100%;}

  /* variables / code */
  .varrow{display:flex;flex-wrap:wrap;gap:12px;}
  .varbox{min-width:86px;background:#0f1528;border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center;}
  .vb-name{font-family:var(--mono);font-size:12px;color:var(--teal);}
  .vb-val{font-family:var(--mono);font-size:26px;font-weight:700;margin-top:2px;}
  .pop{animation:pop .35s ease;}
  @keyframes pop{0%{transform:scale(1.35);color:var(--amber);}100%{transform:scale(1);}}
  .code{background:#0f1528;border:1px solid var(--line);border-radius:12px;padding:8px;font-family:var(--mono);font-size:14.5px;}
  .codeline{display:flex;gap:12px;padding:8px 10px;border-radius:8px;border-left:3px solid transparent;}
  .codeline .ln{color:var(--mut);width:18px;text-align:right;flex:none;}
  .codeline.on{background:rgba(255,179,71,.12);border-left-color:var(--amber);}
  .codeline.branch{border-left-color:var(--violet);}
  .codeline.click{cursor:pointer;} .codeline.click:hover{background:var(--panel2);}
  .codeline.sel{background:rgba(91,140,255,.15);border-left-color:var(--blue);}
  .codeline.bad{background:rgba(255,107,138,.14);border-left-color:var(--coral);}
  .codeline.goodline{background:rgba(95,208,138,.12);border-left-color:var(--green);}
  .goal{background:rgba(91,140,255,.1);border:1px solid rgba(91,140,255,.3);border-radius:12px;padding:12px 14px;}
  .goal .lbl{margin-right:8px;color:var(--blue);}

  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
  .opt{text-align:left;border:1px solid var(--line);background:#0f1528;color:var(--ink);padding:12px 14px;border-radius:11px;
    cursor:pointer;font-size:14px;font-weight:600;}
  .opt:hover:not(:disabled){border-color:var(--mut);}
  .opt.good{border-color:var(--green);background:rgba(95,208,138,.14);}
  .opt.bad{border-color:var(--coral);background:rgba(255,107,138,.14);}
  .opt:disabled{cursor:default;}
  .fb{border-radius:11px;padding:11px 14px;font-size:14px;border:1px solid;}
  .fb.ok{background:rgba(95,208,138,.12);border-color:rgba(95,208,138,.5);}
  .fb.no{background:rgba(255,107,138,.12);border-color:rgba(255,107,138,.5);}
  .fb.info2{background:rgba(63,208,201,.1);border-color:rgba(63,208,201,.4);}
  .note{margin-top:10px;font-size:14px;min-height:20px;}
  .levtabs{display:flex;flex-wrap:wrap;gap:8px;}
  .lev{border:1px solid var(--line);background:transparent;color:var(--mut);padding:7px 13px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px;}
  .lev.on{background:var(--panel2);color:var(--ink);border-color:var(--mut);}
  .qmeta{font-family:var(--mono);font-size:12px;color:var(--mut);}
  .qtext{font-size:18px;font-weight:700;margin:6px 0 12px;max-width:65ch;}
  .qtext.sm{font-size:16px;}
  .result{text-align:center;padding:26px;}
  .result>*+*{margin-top:12px;}
  .score{font-family:var(--mono);font-size:46px;font-weight:800;color:var(--green);}

  /* IPO flow */
  .flow{display:grid;grid-template-columns:1fr 34px 1fr 34px 1fr;gap:8px;align-items:center;}
  .node{border:2px solid var(--line);border-radius:14px;padding:12px;background:#0f1528;transition:border-color .25s, box-shadow .25s;}
  .node .nkind{font-size:12px;font-weight:800;margin-bottom:6px;}
  .node.input .nkind{color:var(--teal);} .node.process .nkind{color:var(--amber);} .node.output .nkind{color:var(--green);}
  .node.active.input{border-color:var(--teal);box-shadow:0 0 18px rgba(63,208,201,.35);}
  .node.active.process{border-color:var(--amber);box-shadow:0 0 18px rgba(255,179,71,.35);}
  .node.active.output{border-color:var(--green);box-shadow:0 0 18px rgba(95,208,138,.35);}
  .node.wrong{border-color:var(--coral);}
  .arrow{height:3px;background:var(--line);position:relative;border-radius:3px;}
  .arrow::after{content:"";position:absolute;right:-2px;top:-5px;border:6px solid transparent;border-left:8px solid var(--line);}
  .arrow.active{background:var(--amber);} .arrow.active::after{border-left-color:var(--amber);}

  /* devices */
  .devgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
  .devcard{background:#0f1528;border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;color:var(--ink);}
  .devcard .em{font-size:30px;} .devcard .nm{font-weight:800;margin-top:6px;}
  .devcard .detail{display:none;font-size:13px;color:var(--mut);margin-top:8px;line-height:1.45;}
  .devcard.open{border-color:var(--teal);} .devcard.open .detail{display:block;}
  .devcard .detail b{color:var(--teal);}

  /* memory */
  .memrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .membox{border-radius:12px;padding:12px;border:2px solid;min-height:88px;}
  .membox.ram{border-color:var(--amber);background:rgba(255,179,71,.07);}
  .membox.store{border-color:var(--green);background:rgba(95,208,138,.07);}
  .mlbl{font-size:12px;font-weight:700;color:var(--mut);}
  .mval{font-family:var(--mono);font-size:16px;margin-top:6px;word-break:break-word;}
  .mval.big{font-size:30px;font-weight:800;color:var(--amber);}
  .bits{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;}
  .bit{border:1px solid var(--line);background:#0f1528;color:var(--ink);border-radius:10px;padding:8px 4px;cursor:pointer;text-align:center;}
  .bit.on{background:rgba(255,179,71,.2);border-color:var(--amber);}
  .bit .bv{font-family:var(--mono);font-size:20px;font-weight:800;} .bit .bw{font-size:11px;color:var(--mut);}

  /* data table */
  .tablewrap{overflow:auto;}
  .datatable{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:14px;}
  .datatable th,.datatable td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;}
  .datatable th{cursor:pointer;color:var(--mut);font-weight:700;user-select:none;}
  .datatable th:hover{color:var(--ink);} .datatable th.sorted{color:var(--teal);}
  .datatable th:first-child,.datatable td:first-child{text-align:left;}
  .totcell{color:var(--amber);font-weight:800;}

  /* smart city */
  .ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;}
  .range{flex:1;min-width:140px;accent-color:var(--teal);}
  .mono{font-family:var(--mono);} .val{min-width:60px;}
  .check{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#0f1528;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-family:var(--mono);font-size:13.5px;}
  .check input{accent-color:var(--amber);width:16px;height:16px;}
  .scene{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .sceneitem{background:#0f1528;border:2px solid var(--line);border-radius:14px;padding:14px;text-align:center;transition:.25s;}
  .sceneitem.on{border-color:var(--green);background:rgba(95,208,138,.1);box-shadow:0 0 16px rgba(95,208,138,.3);}
  .se-emoji{font-size:34px;} .se-lbl{font-size:12.5px;font-weight:700;margin-top:6px;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:1px solid var(--line);background:#0f1528;color:var(--mut);padding:7px 13px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px;}
  .chip.on{border-color:var(--violet);color:var(--ink);background:rgba(167,139,255,.15);}
  .train{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;}
  .tr-item{background:#0f1528;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12.5px;text-align:center;}
  .tr-item.hit{border-color:var(--violet);background:rgba(167,139,255,.14);}
  .tr-item .em{font-size:24px;} .tr-item .lab{font-weight:800;margin-top:2px;} .tr-item .ft{color:var(--mut);font-family:var(--mono);font-size:11px;}

  @media (max-width:820px){
    .app{grid-template-columns:1fr;}
    #menu{display:grid;}
    .bar .back{display:none;}
    .prog{display:none;}
    .side{position:fixed;left:0;top:58px;width:280px;transform:translateX(-100%);transition:transform .25s;z-index:15;box-shadow:0 0 40px rgba(0,0,0,.5);}
    body.navopen .side{transform:translateX(0);}
    .memrow,.scene{grid-template-columns:1fr;}
    .flow{grid-template-columns:1fr;} .arrow{display:none;}
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;} }
</style>
</head>
<body>
<header class="bar">
  <button id="menu" class="icon" title="Labs">☰</button>
  <a class="back" href="index.html">← Subjects</a>
  <div class="titles"><div class="ttl">Computing Lab</div><div class="sub">GRADE 4 · TERM 1 · 2026</div></div>
  <div class="prog"><span id="progress">0 / 10 labs complete</span><div class="track"><div id="bar" class="fill"></div></div></div>
  <button id="reset" class="icon" title="Reset progress">↺</button>
</header>
<div class="app">
  <nav id="nav" class="side"></nav>
  <main id="main" class="main"></main>
</div>

<script>
/* ===================== helpers ===================== */
function el(tag, attrs, ...kids){
  const n=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==='class') n.className=v;
    else if(k==='html') n.innerHTML=v;
    else if(k==='style' && typeof v==='object') Object.assign(n.style,v);
    else if(k.startsWith('on') && typeof v==='function') n.addEventListener(k.slice(2).toLowerCase(),v);
    else if(v!=null) n.setAttribute(k,v);
  }
  for(const kid of kids.flat()){ if(kid==null) continue; n.appendChild(typeof kid==='object'?kid:document.createTextNode(String(kid))); }
  return n;
}
function fb(ok,msgHtml){ const d=el('div',{class:'fb '+(ok?'ok':'no')}); d.appendChild(el('strong',{},ok?'✓ ':'✗ ')); const s=el('span'); s.innerHTML=msgHtml; d.appendChild(s); return d; }
function safeStorage(){
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t');
    return {get:k=>{try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}, set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
  }catch(e){ const m={}; return {get:k=>(k in m?m[k]:null), set:(k,v)=>{m[k]=v;}}; }
}
const store=safeStorage();
const state={progress: store.get('cslab_progress')||{}};
function markComplete(id){ state.progress[id]=true; store.set('cslab_progress',state.progress); refreshNav(); }

/* ---- tiny program evaluator (used by Be the CPU) ---- */
function val(t,vars){ if(typeof t==='number')return t; if(/^-?\d+(\.\d+)?$/.test(t))return Number(t); return (t in vars)?vars[t]:0; }
function applyOp(a,op,b){ switch(op){case'+':return a+b;case'-':return a-b;case'*':return a*b;case'/':return b===0?0:a/b;} return 0; }
function evalExprArr(e,vars){ return e.length===1?val(e[0],vars):applyOp(val(e[0],vars),e[1],val(e[2],vars)); }
function evalCond(c,vars){ const a=val(c[0],vars),b=val(c[2],vars); switch(c[1]){case'>':return a>b;case'<':return a<b;case'>=':return a>=b;case'<=':return a<=b;case'==':return a===b;case'!=':return a!==b;} return false; }
function runProgram(program,init){ const vars={...init}; for(const st of program){ if(st.t==='assign'){vars[st.var]=evalExprArr(st.expr,vars);} else{ const ch=evalCond(st.cond,vars)?st.then:st.else; vars[ch.var]=evalExprArr(ch.expr,vars);} } return {vars}; }
function stmtText(st){ return st.t==='assign' ? `${st.var} = ${st.expr.join(' ')}` : `IF ${st.cond.join(' ')} THEN ${st.then.var} = ${st.then.expr.join(' ')} ELSE ${st.else.var} = ${st.else.expr.join(' ')}`; }

/* ---- lab shell ---- */
function labShell(root,sec){
  const wrap=el('div',{class:'lab'});
  wrap.appendChild(el('div',{class:'lab-head'}, el('div',{class:'lab-no'},'LAB '+String(sec.n).padStart(2,'0')), el('h2',{},sec.title), el('p',{class:'lab-obj'},sec.obj)));
  const seg=el('div',{class:'seg'});
  const panes={learn:el('div',{class:'pane'}),try:el('div',{class:'pane'}),challenge:el('div',{class:'pane'})};
  const body=el('div',{class:'lab-body'});
  [['learn','Learn'],['try','Try'],['challenge','Challenge']].forEach(([k,label],idx)=>{
    const b=el('button',{class:'seg-btn'+(idx===0?' on':'')},label);
    b.addEventListener('click',()=>{ [...seg.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); Object.entries(panes).forEach(([kk,p])=>p.style.display=kk===k?'':'none'); });
    seg.appendChild(b); if(idx!==0)panes[k].style.display='none'; body.appendChild(panes[k]);
  });
  wrap.append(seg,body); root.appendChild(wrap); return panes;
}

/* ---- scored quiz ---- */
function runQuiz(pane,sec,questions,opts={}){
  pane.innerHTML=''; let i=0,correct=0; const topic={};
  const holder=el('div'); pane.appendChild(holder); render();
  function render(){
    holder.innerHTML='';
    if(i>=questions.length) return summary();
    const q=questions[i];
    holder.appendChild(el('div',{class:'qmeta'},`Question ${i+1} of ${questions.length}`+(q.topic?`  ·  ${q.topic}`:'')));
    holder.appendChild(el('p',{class:'qtext',html:q.q}));
    const slot=el('div');
    if(q.type==='number'){
      const inp=el('input',{type:'number',class:'ti',placeholder:'Answer'});
      const go=el('button',{class:'btn primary'},'Check');
      go.addEventListener('click',()=>{ if(inp.value==='')return; inp.disabled=true; go.disabled=true; grade(Number(inp.value)===Number(q.answer),q,slot); });
      inp.addEventListener('keydown',e=>{ if(e.key==='Enter')go.click(); });
      holder.appendChild(el('div',{class:'row'},inp,go));
    }else{
      const box=el('div',{class:'opts'});
      q.options.forEach((o,idx)=>{ const b=el('button',{class:'opt'},o);
        b.addEventListener('click',()=>{ [...box.children].forEach(c=>c.disabled=true); const ok=idx===q.answer; if(ok)b.classList.add('good'); else{b.classList.add('bad'); box.children[q.answer].classList.add('good');} grade(ok,q,slot); });
        box.appendChild(b); });
      holder.appendChild(box);
    }
    holder.appendChild(slot);
  }
  function grade(ok,q,slot){
    if(q.topic){ topic[q.topic]=topic[q.topic]||{c:0,t:0}; topic[q.topic].t++; if(ok)topic[q.topic].c++; }
    if(ok)correct++;
    slot.appendChild(fb(ok,q.why));
    slot.appendChild(el('div',{class:'row',style:{marginTop:'12px'}}, el('button',{class:'btn',onClick:()=>{i++;render();}}, i+1>=questions.length?'See results':'Next question')));
  }
  function summary(){
    const pct=Math.round(100*correct/questions.length); markComplete(sec.id);
    const kids=[el('div',{class:'score'},`${correct} / ${questions.length}`),
      el('p',{class:'mut'},pct>=80?'Excellent work — this topic is solid.':pct>=50?'Good progress. A little more practice will lock it in.':'Keep going — revisit Learn and Try, then have another go.')];
    if(opts.showTopics){
      const weak=Object.keys(topic).filter(k=>topic[k].c/topic[k].t<0.6);
      kids.push(weak.length? el('div',{class:'fb no'},el('strong',{},'Practise more: '),weak.join(', ')) : el('div',{class:'fb ok'},el('strong',{},'Strong across every topic. '),'Nicely done.'));
    }
    kids.push(el('button',{class:'btn primary',onClick:()=>{i=0;correct=0;for(const k in topic)delete topic[k];render();}},'Try again'));
    holder.appendChild(el('div',{class:'result'},...kids));
  }

}

/* ===================== SECTION REGISTRY ===================== */
const learnHTML={
  cpu:`<p>A <b>variable</b> is a labelled box in the computer's memory. It holds one value at a time.</p>
<p><code>A = 5</code> means "put 5 into box A". The <code>=</code> sign is an <b>instruction</b>, not a maths question.</p>
<p><code>A = A + B</code> means "take what is in A, add what is in B, and put the answer back into A". The old value is replaced.</p>
<p><b>Operators</b> do the maths: <code>+</code> add, <code>-</code> subtract, <code>*</code> multiply, <code>/</code> divide.</p>
<p><b>Selection</b> lets the computer choose: <code>IF A > B THEN … ELSE …</code>. It tests the condition. If it is TRUE it runs the THEN part; if FALSE it runs the ELSE part. Only one path runs.</p>
<p>The CPU runs one line at a time, from top to bottom. To predict a program, be the CPU: trace each line and update the boxes.</p>`,
  debug:`<p>An <b>algorithm</b> is a set of steps to reach a goal. A <b>bug</b> is a mistake that stops it working.</p>
<p>Three common bugs:</p><ul><li><b>Wrong order</b> — the steps are right but in the wrong sequence (shoes before socks).</li><li><b>Wrong logic</b> — an IF test is backwards, like <code>&lt;</code> instead of <code>&gt;=</code>.</li><li><b>Missing or extra step</b> — something needed is left out, or something pointless is added.</li></ul>
<p><b>Debugging</b> = testing with an example, watching where it goes wrong, then fixing that step. Always re-run to check the fix.</p>`,
  ai:`<p><b>Artificial intelligence</b> learns from examples instead of following fixed rules. The examples are called <b>training data</b>.</p>
<p>Each example has <b>features</b> (colour, shape, size) and a <b>label</b> (the answer). The AI looks for patterns: "long + yellow is usually a banana".</p>
<p>When it sees something new, it compares it with what it has seen and guesses the label. This is called <b>classification</b>.</p>
<p>AI is only as good as its data. If the examples are <b>incomplete or one-sided (biased)</b>, the AI makes confident mistakes — like never having seen a green apple.</p>`,
  ipo:`<p>Every computer system follows the same cycle:</p>
<p><span class="k in">INPUT</span> data comes in — from a keyboard, microphone, camera or sensor.</p>
<p><span class="k pr">PROCESS</span> the computer works on it — calculating, comparing, deciding.</p>
<p><span class="k out">OUTPUT</span> the result goes out — on a screen, through a speaker, or by moving a motor.</p>
<p>Example: a voice assistant. Microphone (input) → recognise the words and find an answer (process) → speaker plays the reply (output).</p>`,
  dev:`<p><b>Input devices</b> get data <i>into</i> a computer. <b>Output devices</b> send results <i>out</i>.</p>
<p><b>Sensors</b> are input devices that measure the real world: light, temperature, movement, distance. They let computers react to what is happening around them.</p>
<p>Choosing the right device means asking: <i>what data do I need?</i> To know if it is dark, you need light data — so a light sensor.</p>`,
  storage:`<p>A computer uses two kinds of memory:</p>
<p><b>RAM</b> is fast working memory — like a desk you spread your work on. It only keeps data while the power is on.</p>
<p><b>Storage</b> (hard drive, SSD, memory card, cloud) is like a filing cabinet. It is slower, but keeps files even when the computer is off.</p>
<p><b>Saving</b> copies your work from RAM into storage. <b>Opening</b> copies it back into RAM.</p>
<p>Deep down, all data is stored as <b>binary</b> — patterns of 0 and 1. Eight of these (a byte) can store a number, a letter, or part of a picture.</p>`,
  data:`<p><b>Raw data</b> is just numbers or words — sales figures, temperatures, scores. On their own they do not tell you much.</p>
<p><b>Processing</b> turns raw data into <b>information</b> you can use:</p><ul><li><b>Sort</b> to put things in order</li><li><b>Add up</b> to find totals</li><li><b>Compare</b> to find the biggest, smallest or a pattern</li><li><b>Filter</b> to look at just part of the data</li></ul>
<p>Information answers a question: "Which item sells best?" "Which day is busiest?"</p>`,
  city:`<p>A <b>smart city</b> joins sensors, rules and devices into one system — an IPO cycle you can see.</p>
<p><span class="k in">Sensors</span> measure light, movement and temperature. <span class="k pr">Rules</span> use IF/THEN to decide. <span class="k out">Devices</span> like lights, doors and alarms respond.</p>
<p>A rule like <code>IF it is dark THEN street lights ON</code> is <b>selection</b> — the same IF/ELSE idea from programming, now controlling the real world.</p>
<p>Rules can combine conditions: <code>IF dark AND motion THEN alarm ON</code>.</p>`,
  cvh:`<p>Computers and people are good at different things.</p>
<p><b>Computers</b> are fast, exact and never get bored. They are best at repetitive maths, sorting, searching, and spotting patterns in huge amounts of data.</p>
<p><b>People</b> understand meaning, feelings, humour and fairness. We can handle new situations nobody trained us for.</p>
<p>AI can copy patterns very well, but it does not truly understand or feel. So the best results often come from people and computers <b>working together</b>.</p>`,
  final:`<p>This challenge mixes every lab: variables, operators, IF/ELSE, algorithms, devices, IPO, storage, data, AI, sensors and debugging.</p>
<p>Read each scenario carefully and think like the CPU. At the end you will see your score and which topics to practise more.</p>`
};
function makeBuilder(key,tryFn,challenge,opts){ return function(root,sec){ const p=labShell(root,sec); p.learn.appendChild(el('div',{class:'panel prose',html:learnHTML[key]})); if(tryFn)tryFn(p.try); else p.try.appendChild(el('div',{class:'panel prose'},el('p',{},'Go straight to the Challenge — this lab is the final test.'))); runQuiz(p.challenge,sec,challenge,opts||{}); }; }
const SECTIONS=[
  {id:'cpu',n:1,title:'Be the CPU',tag:'Variables · operators · IF/ELSE',obj:'Run programs by hand. Predict what each line does, then step through and watch the memory change.',build:makeBuilder('cpu',cpuTry,cpuChallenge)},
  {id:'debug',n:2,title:'Debug the Algorithm',tag:'Planning · sequencing · fixing',obj:'Find the faulty step in a broken algorithm, replace it, and run it to prove the fix works.',build:makeBuilder('debug',debugTry,debugChallenge)},
  {id:'ai',n:3,title:'Train the AI',tag:'Classification · features · bias',obj:'Choose what a tiny AI looks at, watch it classify mystery fruit, and see how bad data leads to bad guesses.',build:makeBuilder('ai',aiTry,aiChallenge)},
  {id:'ipo',n:4,title:'IPO Simulator',tag:'Input → Process → Output',obj:'Build the right chain for real devices and send data flowing through it.',build:makeBuilder('ipo',ipoTry,ipoChallenge)},
  {id:'dev',n:5,title:'Input Device Lab',tag:'Devices · sensors',obj:'Explore what data each device and sensor collects, then pick the right one for the job.',build:makeBuilder('dev',devTry,devChallenge)},
  {id:'storage',n:6,title:'Data Storage Lab',tag:'RAM · storage · binary',obj:'Type, save, switch off, and open a file to see where data lives — then build numbers from 0s and 1s.',build:makeBuilder('storage',storageTry,storageChallenge)},
  {id:'data',n:7,title:'Data Detective',tag:'Sorting · totals · patterns',obj:'Sort and process a real dataset to turn raw numbers into useful information.',build:makeBuilder('data',dataTry,dataChallenge)},
  {id:'city',n:8,title:'Smart City Sensor Lab',tag:'Sensors · rules · IPO',obj:'Change the sensors, tick the rules, and watch the city react — the whole IPO cycle in one place.',build:makeBuilder('city',cityTry,cityChallenge)},
  {id:'cvh',n:9,title:'Computer vs Human',tag:'Strengths · limits of AI',obj:'Decide who is better suited to each task, and why. It is not always the computer.',build:makeBuilder('cvh',cvhTry,cvhChallenge)},
  {id:'final',n:10,title:'Final CS Challenge',tag:'Everything, mixed',obj:'A scenario-based test across all topics. Get a score and see exactly what to revise.',build:makeBuilder('final',null,finalChallenge,{showTopics:true})},
];

/* ===================== nav ===================== */
const mainEl=document.getElementById('main'), navEl=document.getElementById('nav'); let currentId=null;
function refreshNav(){
  [...navEl.children].forEach(n=>{ n.classList.toggle('on',n.dataset.id===currentId); n.querySelector('.navdot').classList.toggle('done',!!state.progress[n.dataset.id]); });
  const done=SECTIONS.filter(s=>state.progress[s.id]).length;
  document.getElementById('progress').textContent=`${done} / ${SECTIONS.length} labs complete`;
  document.getElementById('bar').style.width=(100*done/SECTIONS.length)+'%';
}
function go(id){ currentId=id; const sec=SECTIONS.find(s=>s.id===id); mainEl.innerHTML=''; sec.build(mainEl,sec); window.scrollTo({top:0}); document.body.classList.remove('navopen'); refreshNav(); }
SECTIONS.forEach(s=>{ const item=el('button',{class:'navitem'}); item.dataset.id=s.id;
  item.append(el('span',{class:'no'},String(s.n).padStart(2,'0')),el('span',{class:'ninfo'},el('span',{class:'t'},s.title),el('span',{class:'tag'},s.tag)),el('span',{class:'navdot'}));
  item.addEventListener('click',()=>go(s.id)); navEl.appendChild(item); });
document.getElementById('menu').addEventListener('click',()=>document.body.classList.toggle('navopen'));
document.getElementById('reset').addEventListener('click',()=>{ if(confirm('Reset all lab progress?')){ state.progress={}; store.set('cslab_progress',{}); refreshNav(); } });
go(SECTIONS[0].id);
</script>
